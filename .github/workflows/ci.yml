name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }} / Zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        zod: ["4.4.3", "^4.4.3"]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install zod@${{ matrix.zod }}
        if: matrix.zod != '4.4.3'
        run: |
          zod_version="$(
            npm view "zod@${{ matrix.zod }}" version --json |
              jq -r 'if type == "array" then last else . end'
          )"
          pnpm update --workspace-root --no-save "zod@$zod_version"
          test "$(node -p "require('zod/package.json').version")" = "$zod_version"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run check:exports
