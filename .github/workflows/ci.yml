name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zod: ["4.4.3", "latest"]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add --workspace-root --save-dev --lockfile=false "zod@${{ matrix.zod }}"
      - run: vp check
      - run: vp test run
      - run: vp run check:exports
