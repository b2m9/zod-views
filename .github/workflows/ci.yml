name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  ci:
    name: Node ${{ matrix.node }} / Zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        zod: ["4.4.3", "^4.4.3"]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install zod@${{ matrix.zod }}
        if: matrix.zod != '4.4.3'
        run: pnpm update --workspace-root --no-save --no-lockfile "zod@${{ matrix.zod }}"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run check:exports
