name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            echo "::error::Prerelease version ${PACKAGE_VERSION} requires an explicit npm dist-tag"
            exit 1
          fi

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} must match package.json version ${PACKAGE_VERSION} as ${EXPECTED_TAG}"
            exit 1
          fi

  stage:
    name: Stage package on npm
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Validate package exports
        run: vp run check:exports

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Assert npm staged publishing support
        run: |
          npm --version
          npm stage --help

      # Publishing ignores lifecycle scripts, so dist must be built here.
      - name: Build package
        run: vp run build

      - name: Dry-run npm package contents
        run: npm pack --dry-run

      - name: Stage package on npm
        run: npm stage publish --ignore-scripts
