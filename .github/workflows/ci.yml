name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 6"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }} / Zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        zod: ["4.4.3", "^4.4.3"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install zod@${{ matrix.zod }}
        if: matrix.zod != '4.4.3'
        run: |
          zod_version="$(
            npm view "zod@${{ matrix.zod }}" version --json |
              jq -r 'if type == "array" then last else . end'
          )"
          # `pnpm update --no-save` cannot leave the exact dev pin's range.
          pnpm add --workspace-root --save-dev "zod@$zod_version"
          test "$(node -p "require('zod/package.json').version")" = "$zod_version"
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run check:exports
